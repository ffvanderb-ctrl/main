<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>Site Visitor Automator</title>
</head>
<body>
  <header>
    <h1>Site Visitor Automator</h1>
    <div id="status" class="status idle">Idle</div>
  </header>

  <main>
    <section class="block">
      <div class="label-row">
        <label class="field-label">Site categories</label>
        <span class="hint" id="count"></span>
      </div>
      <div id="categories" class="cats"></div>
    </section>

    <section class="block">
      <label class="field-label" for="sites">Extra custom sites (one per line)</label>
      <textarea id="sites" rows="3" placeholder="example.com&#10;mysite.org"></textarea>
    </section>

    <section class="block grid">
      <div>
        <label class="field-label" for="dwell">Seconds per site</label>
        <input type="number" id="dwell" min="3" max="3600" />
      </div>
      <div>
        <label class="field-label" for="interval">Action every (sec)</label>
        <input type="number" id="interval" min="1" max="60" />
      </div>
    </section>

    <section class="block checks">
      <label><input type="checkbox" id="scroll" /> Scroll the page</label>
      <label><input type="checkbox" id="click" /> Click elements (browse-only)</label>
      <label><input type="checkbox" id="loop" /> Loop forever</label>
      <label><input type="checkbox" id="shuffle" /> Randomize visit order</label>
    </section>

    <section class="block actions">
      <button id="toggle" class="primary">Start</button>
      <button id="save" class="secondary">Save</button>
    </section>

    <p id="progress" class="progress"></p>
    <p id="msg" class="msg"></p>
  </main>

  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
